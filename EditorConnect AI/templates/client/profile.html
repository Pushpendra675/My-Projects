{% extends "base.html" %}
{% block title %}Profile — EditorConnect AI{% endblock %}

{% block content %}
<p class="timecode mb-3">CLIENT / PROFILE</p>
<h1 class="font-display text-3xl font-semibold mb-8">Your profile</h1>

<div class="max-w-xl">
  <form method="POST" enctype="multipart/form-data" class="glass rounded-3xl p-8 space-y-5">
    <div class="flex items-center gap-4 mb-2">
      <div class="w-16 h-16 rounded-2xl bg-violet-glow/20 border border-violet-glow/30 flex items-center justify-center text-xl font-semibold text-violet-glow">
        {{ current_user.name[0]|upper }}
      </div>
      <div>
        <label class="block text-xs font-medium text-ink-muted mb-1.5">Update photo</label>
        <input type="file" name="avatar" accept="image/*" class="text-xs text-ink-faint file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-white/10 file:text-ink file:text-xs">
      </div>
    </div>

    <div>
      <label class="block text-xs font-medium text-ink-muted mb-1.5">Full name</label>
      <input type="text" name="name" value="{{ current_user.name }}" class="w-full input-glass rounded-xl px-4 py-3 text-sm outline-none">
    </div>
    <div>
      <label class="block text-xs font-medium text-ink-muted mb-1.5">Email</label>
      <input type="email" value="{{ current_user.email }}" disabled class="w-full input-glass rounded-xl px-4 py-3 text-sm outline-none opacity-50 cursor-not-allowed">
    </div>
    <div>
      <label class="block text-xs font-medium text-ink-muted mb-1.5">Phone</label>
      <input type="tel" name="phone" value="{{ current_user.phone or '' }}" class="w-full input-glass rounded-xl px-4 py-3 text-sm outline-none">
    </div>

    <button type="submit" class="w-full py-3 rounded-xl btn-gradient text-white text-sm font-medium shadow-glow">Save changes</button>
  </form>
</div>
{% endblock %}
