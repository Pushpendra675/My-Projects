{% extends "base.html" %}
{% block title %}Sign up — EditorConnect AI{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-10">
  <div class="w-full max-w-lg fade-in-up">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-grade-gradient flex items-center justify-center mx-auto mb-4 shadow-glow">
        <i data-lucide="clapperboard" class="w-6 h-6 text-white"></i>
      </div>
      <h1 class="font-display text-2xl font-semibold mb-1">Create your account</h1>
      <p class="text-sm text-ink-muted">Join as a client or a creative professional</p>
    </div>

    <div class="glass-strong rounded-3xl p-8 shadow-glass">
      <form method="POST" enctype="multipart/form-data" class="space-y-4">

        <div>
          <label class="block text-xs font-medium text-ink-muted mb-2">I am a...</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="cursor-pointer">
              <input type="radio" name="role" value="client" class="peer sr-only" checked onchange="document.getElementById('profession-field').classList.add('hidden')">
              <div class="glass rounded-xl p-4 text-center peer-checked:border-violet-glow peer-checked:bg-violet-glow/10 border border-transparent transition-colors">
                <i data-lucide="briefcase" class="w-5 h-5 mx-auto mb-2 text-violet-glow"></i>
                <p class="text-sm font-medium">Client</p>
                <p class="text-xs text-ink-faint mt-0.5">I want to hire</p>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="role" value="professional" class="peer sr-only" onchange="document.getElementById('profession-field').classList.remove('hidden')">
              <div class="glass rounded-xl p-4 text-center peer-checked:border-teal-glow peer-checked:bg-teal-glow/10 border border-transparent transition-colors">
                <i data-lucide="clapperboard" class="w-5 h-5 mx-auto mb-2 text-teal-glow"></i>
                <p class="text-sm font-medium">Professional</p>
                <p class="text-xs text-ink-faint mt-0.5">I want to work</p>
              </div>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-ink-muted mb-1.5">Full name</label>
          <input type="text" name="name" required
                 class="w-full input-glass rounded-xl px-4 py-3 text-sm placeholder-ink-faint outline-none"
                 placeholder="Aarav Sharma">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-ink-muted mb-1.5">Email</label>
            <input type="email" name="email" required
                   class="w-full input-glass rounded-xl px-4 py-3 text-sm placeholder-ink-faint outline-none"
                   placeholder="you@example.com">
          </div>
          <div>
            <label class="block text-xs font-medium text-ink-muted mb-1.5">Phone</label>
            <input type="tel" name="phone"
                   class="w-full input-glass rounded-xl px-4 py-3 text-sm placeholder-ink-faint outline-none"
                   placeholder="Optional">
          </div>
        </div>

        <div id="profession-field" class="hidden">
          <label class="block text-xs font-medium text-ink-muted mb-1.5">Profession</label>
          <select name="profession" class="w-full input-glass rounded-xl px-4 py-3 text-sm outline-none">
            {% for p in professions %}
            <option value="{{ p }}">{{ p }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-ink-muted mb-1.5">Password</label>
          <input type="password" name="password" required minlength="6"
                 class="w-full input-glass rounded-xl px-4 py-3 text-sm placeholder-ink-faint outline-none"
                 placeholder="At least 6 characters">
        </div>

        <button type="submit" class="w-full py-3 rounded-xl btn-gradient text-white font-medium shadow-glow mt-2">
          Create account
        </button>
      </form>
    </div>

    <p class="text-center text-sm text-ink-muted mt-6">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="text-violet-glow hover:underline">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
