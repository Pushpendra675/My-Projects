{% extends "base.html" %}
{% block title %}Log in — EditorConnect AI{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-10">
  <div class="w-full max-w-md fade-in-up">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-grade-gradient flex items-center justify-center mx-auto mb-4 shadow-glow">
        <i data-lucide="clapperboard" class="w-6 h-6 text-white"></i>
      </div>
      <h1 class="font-display text-2xl font-semibold mb-1">Welcome back</h1>
      <p class="text-sm text-ink-muted">Log in to continue to EditorConnect AI</p>
    </div>

    <div class="glass-strong rounded-3xl p-8 shadow-glass">
      <form method="POST" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-ink-muted mb-1.5">Email</label>
          <input type="email" name="email" required autofocus
                 class="w-full input-glass rounded-xl px-4 py-3 text-sm placeholder-ink-faint outline-none transition-colors"
                 placeholder="you@example.com">
        </div>
        <div>
          <label class="block text-xs font-medium text-ink-muted mb-1.5">Password</label>
          <input type="password" name="password" required
                 class="w-full input-glass rounded-xl px-4 py-3 text-sm placeholder-ink-faint outline-none transition-colors"
                 placeholder="••••••••">
        </div>
        <button type="submit" class="w-full py-3 rounded-xl btn-gradient text-white font-medium shadow-glow mt-2">
          Log in
        </button>
      </form>
    </div>

    <p class="text-center text-sm text-ink-muted mt-6">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}" class="text-violet-glow hover:underline">Sign up</a>
    </p>
  </div>
</div>
{% endblock %}
